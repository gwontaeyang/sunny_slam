hesai_pointcloud_ingest:
  ros__parameters:
    use_sim_time: true

    "front.input_topic": /hesai/front/lidar_points
    "front.output_topic": /slam_3d/input/hesai_front/points_timed
    "front.expected_input_frame_id": hesai_front
    "front.require_expected_input_frame": true
    "front.model": JT128
    "front.sensor_id": 0
    "front.max_ring_id": 127
    "front.min_points": 200000
    "front.max_points": 260000
    # Offline fit from the bounded offset-190 s bag. This is deterministic
    # replay salvage, not a hardware clock calibration.
    "front.clock_domain": rosbag_record_time_affine_fit
    "front.clock_policy": calibrated_sensor_time
    "front.time_offset_ns": 0
    "front.time_scale": 0.9998056435707641
    "front.anchor_input_header_ns": 2058806499000
    "front.anchor_output_start_ns": 2060123168706
    "front.calibration_valid_min_input_header_ns": 2058806499000
    "front.calibration_valid_max_input_header_ns": 2082780107000
    "front.max_output_stamp_step_s": 2.0
    "front.calibration_fit_rmse_ms": 9.153865271145123
    "front.calibration_fit_max_abs_ms": 32.130494458007815
    "front.calibration_id": geoje_offset190_24s_record_time_fit_v1

    "rear.input_topic": /hesai/rear/lidar_points
    "rear.output_topic": /slam_3d/input/hesai_rear/points_timed
    "rear.expected_input_frame_id": hesai_rear
    "rear.require_expected_input_frame": true
    "rear.model": JT128
    "rear.sensor_id": 1
    "rear.max_ring_id": 127
    "rear.min_points": 200000
    "rear.max_points": 260000
    "rear.clock_domain": rosbag_record_time_affine_fit
    "rear.clock_policy": calibrated_sensor_time
    "rear.time_offset_ns": 0
    "rear.time_scale": 1.000143174095286
    "rear.anchor_input_header_ns": 2058878705000
    "rear.anchor_output_start_ns": 2060194911602
    "rear.calibration_valid_min_input_header_ns": 2058878705000
    "rear.calibration_valid_max_input_header_ns": 2082758217000
    "rear.max_output_stamp_step_s": 2.0
    "rear.calibration_fit_rmse_ms": 8.619848524844287
    "rear.calibration_fit_max_abs_ms": 31.776413386962896
    "rear.calibration_id": geoje_offset190_24s_record_time_fit_v1

    "center.input_topic": /hesai/center/lidar_points
    "center.output_topic": /slam_3d/input/hesai_center/points_timed
    "center.expected_input_frame_id": hesai_center
    "center.require_expected_input_frame": true
    "center.model": XT32
    "center.sensor_id": 2
    "center.max_ring_id": 31
    "center.min_points": 100000
    "center.max_points": 160000
    "center.clock_domain": rosbag_record_time_affine_fit
    "center.clock_policy": calibrated_sensor_time
    "center.time_offset_ns": 0
    "center.time_scale": 0.9999649167993059
    "center.anchor_input_header_ns": 1589934612199934959
    "center.anchor_output_start_ns": 2060146858732
    "center.calibration_valid_min_input_header_ns": 1589934612199934959
    "center.calibration_valid_max_input_header_ns": 1589934636099886894
    "center.max_output_stamp_step_s": 2.0
    "center.calibration_fit_rmse_ms": 9.462261950529122
    "center.calibration_fit_max_abs_ms": 37.351395180175787
    "center.calibration_id": geoje_offset190_24s_record_time_fit_v1

    health_topic: /slam_3d/ingest/health
    input_depth: 10
    output_depth: 5
    input_reliable: true
    output_reliable: true
    drop_nonfinite_points: true
    reject_non_increasing_output_stamp: true
    reject_clock_misalignment: false
    max_sensor_header_to_receive_delta_s: 0.25
    max_points: 500000
    max_scan_duration_s: 0.2
    min_finite_point_ratio: 0.9
    max_header_first_point_delta_s: 0.005
    timestamp_regression_tolerance_s: 1.0e-9
    require_monotonic_timestamps: true
    require_nonzero_duration: true
    require_header_matches_first_point: true
