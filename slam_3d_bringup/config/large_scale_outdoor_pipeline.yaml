profile: gole_hesai_jt128_xt32_large_scale_outdoor_v1

purpose:
  environment: very_large_outdoor_construction_site
  disturbance:
    - intermittent_threshold_crossing_shock
    - roll_pitch_impulse
    - wheel_slip
    - repeated_structure
  sensors:
    lidar:
      front: hesai_jt128
      rear: hesai_jt128
      center: hesai_xt32
    wheel_odom: /motor_driver_node/odom
    imu: /imu/data
  goal: editable_internal_lidar_inertial_3d_slam

frames:
  global: map
  continuous: odom
  base: base_link
  lidar:
    front: hesai_front
    rear: hesai_rear
    center: hesai_center
  imu_observed: cv7_link

inputs:
  raw_clouds:
    front: /hesai/front/lidar_points
    rear: /hesai/rear/lidar_points
    center: /hesai/center/lidar_points
  canonical_clouds:
    front: /slam_3d/input/hesai_front/points_timed
    rear: /slam_3d/input/hesai_rear/points_timed
    center: /slam_3d/input/hesai_center/points_timed
  wheel_odom: /motor_driver_node/odom
  imu: /imu/data
  tf: /tf
  tf_static: /tf_static

outputs:
  reference_wheel_imu_odom: /slam_3d/reference/wheel_imu_odom
  frontend_odom: /slam_3d/frontend/odom
  frontend_path: /slam_3d/frontend/path
  active_submap: /slam_3d/map/active_submap
  global_map: /slam_3d/map/global_cloud
  ingest_health: /slam_3d/ingest/health
  slam_health: /slam_3d/health

observed_geoje_contract:
  source: 02_samsung_geoje
  lidar_layout:
    point_step_bytes: 26
    fields: [x_float32, y_float32, z_float32, intensity_float32, ring_uint16, timestamp_float64]
  front_jt128: {points: 230400, rings: 128, scan_duration_s: 0.100}
  rear_jt128: {points: 230400, rings: 128, scan_duration_s: 0.100}
  center_xt32: {points: 128000, rings: 32, scan_duration_s: 0.100}
  timestamp:
    granularity: packet_time_repeated_for_256_points
    exact_firing_time: unavailable
    common_lidar_imu_clock: false
    constant_offset_sufficient: false
  recoverable:
    - xyz_intensity_ring
    - packet_order_and_packet_relative_time
    - sensor_local_monotonic_timeline
    - recorded_static_extrinsics
  not_recoverable:
    - exact_lidar_to_imu_time_offset
    - channel_firing_time
    - ptp_lock_history
    - driver_and_network_latency
    - return_mode_and_firetime_table

sensor_ingest:
  package: slam_3d_lidar_ingest
  executable: hesai_pointcloud_ingest_node
  responsibilities:
    - validate_pointcloud2_layout_and_bounds
    - validate_frame_model_ring_and_point_count_profile
    - expose_packet_timestamp_granularity
    - normalize_to_header_plus_uint32_offset_time
    - reject_nonfinite_and_nonmonotonic_inputs
  explicitly_not_owned:
    - extrinsic_transform
    - geometric_lidar_merge
    - scan_matching
    - imu_integration
  production_time:
    policy: sensor_header
    required_clock: measured_common_ptp_domain
    ptp_status_validation: required_driver_extension
  geoje_legacy_time:
    policy: calibrated_sensor_time
    calibration: fixed_anchor_plus_affine_sensor_clock_fit
    target: bag_record_time_minus_observed_scan_duration
    quality: deterministic_bag_record_time_salvage_only
    requires: [use_sim_time, rosbag_clock]

multi_lidar_frontend:
  package: slam_3d_core
  executable: scan_to_map_icp_node
  trigger_sensor: center_xt32
  auxiliary_sensors: [front_jt128, rear_jt128]
  synchronization:
    structure: bounded_per_sensor_queue
    consume_once: true
    queue_order: sensor_timestamp_sorted
    production_stamp_tolerance_s: 0.01
    reorder_window_s: 0.02
    decision_watermarks:
      - latest_auxiliary_sensor_stamp
    cross_topic_primary_progress_is_dropout_proof: false
    wall_dropout_timeout_s: 0.50
    wall_timeout_role: auxiliary_stream_stall_or_end_of_input
    queue_sizing_rule: capacity_at_least_primary_rate_hz_times_wall_timeout_s
    timeout_policy: process_available_clouds_with_degraded_diagnostics
    inter_lidar_wheel_lookup: exact_or_interpolated_bracket_only
    inter_lidar_failure_policy: drop_auxiliary
  preprocessing_order:
    - validate_canonical_point_time
    - lookup_sensor_to_base_tf_or_reject_sensor_cloud
    - transform_sensor_points_to_base_frame
    - packet_level_imu_rotation_deskew_per_sensor
    - wheel_interpolate_auxiliary_clouds_to_primary_stamp
    - concatenate_available_base_frame_clouds
    - crop_robot_body_and_range
    - adaptive_voxel_downsample
  registration:
    baseline: gicp_scan_to_local_map
    geoje_bounded_replay: voxel_surfel_scan_to_local_map
    robust_refinement: trimmed_correspondence_optional
    prediction:
      - wheel_odom_delta
      - imu_rotation
      - constant_velocity_fallback
    shock_policy:
      - detect_imu_roughness
      - quarantine_implausible_pose_correction
      - avoid_keyframe_insertion_during_shock
    place_recognition:
      descriptor: scan_context_family
      geometric_verification: gicp_against_candidate_submap
      robust_pose_graph_kernel: cauchy
  current_limits:
    - packet_time_not_channel_firing_time
    - gyro_only_deskew_without_translation_or_imu_bias_state
    - inter_lidar_motion_compensation_depends_on_wheel_odom_quality
    - no_iterated_error_state_kalman_filter
    - pointxyz_internal_type_discards_sensor_identity_after_merge
    - no_persistent_submap_store
    - no_production_incremental_factor_graph

production_frontend_target:
  design: iterated_error_state_lio
  state:
    - position
    - velocity
    - orientation
    - accelerometer_bias
    - gyroscope_bias
    - gravity
    - optional_per_lidar_time_offset_and_extrinsic
  measurement_model:
    type: direct_point_to_plane_or_surfel_local_map
    per_sensor_residual_statistics: true
    degeneracy:
      metric: normal_equation_eigenvalues
      response:
        - downweight_unobservable_directions
        - increase_covariance
        - retain_imu_and_wheel_constraints
  required_before_claiming_tightly_coupled_lio:
    - publish_corrected_channel_firing_time_from_hesai_sdk
    - verify_ptp_lock_offset_rate_and_reset
    - calibrate_imu_intrinsics_and_lidar_imu_extrinsics
    - estimate_or_measure_lidar_imu_time_offset
    - add_imu_preintegration_or_error_state_propagation
    - add_translation_deskew

submaps:
  creation:
    max_keyframes: 60
    max_length_m: 45.0
    overlap_keyframes: 10
  persistence:
    cloud: pcd_or_laz
    metadata: yaml_or_sqlite
    pose_graph: g2o_or_structured_binary
  publishing:
    active_hz: 2.0
    global_hz: 0.1
    global_voxel_m: 0.25

backend:
  factors:
    - frontend_between
    - verified_loop
    - wheel_planar_velocity
    - optional_gnss
    - optional_manual_anchor
  loop_robustness:
    descriptor_candidate_generation: true
    geometric_verification: true
    robust_kernel: cauchy
    reject_large_residual_or_low_overlap: true
  optimization_triggers:
    - accepted_loop
    - completed_submap
    - explicit_map_save

tf_ownership:
  default: publish_no_slam_tf
  mapping:
    owner: slam_backend_only
    requires_disabled:
      - existing_localization_tf_owner
      - nav2_amcl_tf
  static_extrinsics:
    geoje_bag: consume_recorded_tf_static
    live: publish_only_after_calibration_verification

health_metrics:
  ingest:
    - accepted_and_rejected_scans_per_sensor
    - frame_ring_and_point_count_contract
    - packet_timestamp_plateau_length
    - header_to_receive_delta
    - peer_start_skew
  frontend:
    - input_clouds_expected_and_merged
    - auxiliary_consumed_missing_stale_and_overflow
    - deskew_status_and_imu_coverage
    - registration_fitness_inlier_ratio_and_rmse
    - correction_translation_and_rotation
    - shock_quarantine_count
    - frontend_latency
  backend:
    - node_edge_and_loop_counts
    - residual_before_and_after
    - solver_iterations_status_and_time
    - accepted_and_rejected_loop_statistics

validation_ladder:
  - synthetic_three_cloud_contract_and_sync_tests
  - geoje_static_short_bag_ingest_contract
  - geoje_center_xt32_only_geometry_baseline
  - geoje_front_jt128_only_geometry_baseline
  - geoje_rear_jt128_only_geometry_baseline
  - geoje_three_lidar_packet_deskew_baseline
  - shock_segment_ablation_without_and_with_deskew
  - repeated_area_loop_closure_ablation
  - one_lidar_dropout_and_timestamp_reset
  - live_ptp_static_recording
  - live_rough_outdoor_large_loop
  - long_duration_map_memory_and_persistence

references:
  - https://github.com/HesaiTechnology/HesaiLidar_ROS_2.0
  - https://github.com/HesaiTechnology/HesaiLidar_SDK_2.0
  - https://github.com/hku-mars/FAST_LIO
  - https://github.com/TixiaoShan/LIO-SAM
