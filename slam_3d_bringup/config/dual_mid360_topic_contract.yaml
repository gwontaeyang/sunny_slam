contract: gole_dual_mid360_3d_slam_topics_v0

frames:
  map: map
  odom: odom
  base: base_link
  imu: imu_link
  front_lidar: mid360_front_link
  rear_lidar: mid360_rear_link

existing_inputs:
  wheel_odom:
    topic: /motor_driver_node/odom
    type: nav_msgs/msg/Odometry
    current_owner: gole_core/device/driver/motor_driver
    notes: Published as motor_driver_node relative topic ~/odom. Used as velocity/planar prior.
  external_imu:
    topic: /imu/data
    type: sensor_msgs/msg/Imu
    current_owner: microstrain_or_external_imu_driver
    notes: Primary gravity/angular-rate source for deskew and LIO propagation.

mid360_raw_inputs:
  front_custom:
    topic: /slam_3d/input/mid360_front/livox
    preferred_type: livox_ros_driver2/msg/CustomMsg
    required_fields:
      - per_point_offset_time
      - x
      - y
      - z
      - reflectivity_or_intensity
      - line_or_tag_when_available
    frame_id: mid360_front_link
  rear_custom:
    topic: /slam_3d/input/mid360_rear/livox
    preferred_type: livox_ros_driver2/msg/CustomMsg
    required_fields:
      - per_point_offset_time
      - x
      - y
      - z
      - reflectivity_or_intensity
      - line_or_tag_when_available
    frame_id: mid360_rear_link
  front_points_timed:
    topic: /slam_3d/input/mid360_front/points_timed
    type: sensor_msgs/msg/PointCloud2
    owner: slam_3d_livox_ingest
    required_fields:
      x: FLOAT32
      y: FLOAT32
      z: FLOAT32
      intensity: FLOAT32
      offset_time: UINT32_nanoseconds_relative_to_header
      tag: UINT8
      line: UINT8
      lidar_id: UINT8
    header_stamp: livox_custom_timebase_plus_measured_sensor_offset
    use: validated_frontend_input
  rear_points_timed:
    topic: /slam_3d/input/mid360_rear/points_timed
    type: sensor_msgs/msg/PointCloud2
    owner: slam_3d_livox_ingest
    required_fields:
      x: FLOAT32
      y: FLOAT32
      z: FLOAT32
      intensity: FLOAT32
      offset_time: UINT32_nanoseconds_relative_to_header
      tag: UINT8
      line: UINT8
      lidar_id: UINT8
    header_stamp: livox_custom_timebase_plus_measured_sensor_offset
    use: validated_frontend_input
  front_points_debug:
    topic: /slam_3d/input/mid360_front/points_debug
    type: sensor_msgs/msg/PointCloud2
    use: lossy_visualization_or_legacy_dataset_replay_only
  rear_points_debug:
    topic: /slam_3d/input/mid360_rear/points_debug
    type: sensor_msgs/msg/PointCloud2
    use: lossy_visualization_or_legacy_dataset_replay_only

ingest_health:
  topic: /slam_3d/ingest/health
  type: diagnostic_msgs/msg/DiagnosticArray
  owner: slam_3d_livox_ingest
  rejection_policy:
    - invalid_or_missing_timebase
    - point_count_mismatch
    - insufficient_finite_points
    - offset_time_regression
    - zero_or_excessive_scan_duration
    - non_increasing_packet_timebase
  notes: Front and rear remain separate. Peer start skew is diagnostic-only until paired synchronization is implemented.
  commissioning_metadata:
    front_clock_domain: unverified_until_measured
    rear_clock_domain: unverified_until_measured
    imu_clock_domain: unverified_until_measured
    front_lidar_to_imu_offset_ns: 0_until_measured
    rear_lidar_to_imu_offset_ns: 0_until_measured

internal_topics:
  reference_wheel_imu_odom:
    topic: /slam_3d/reference/wheel_imu_odom
    type: nav_msgs/msg/Odometry
    owner: robot_localization_optional_reference_ekf
    publishes_tf: false
  deskewed_front_points:
    topic: /slam_3d/deskewed/mid360_front
    type: sensor_msgs/msg/PointCloud2
    use: debug_after_raw_lio_fields_have_been_consumed
  deskewed_rear_points:
    topic: /slam_3d/deskewed/mid360_rear
    type: sensor_msgs/msg/PointCloud2
    use: debug_after_raw_lio_fields_have_been_consumed
  frontend_odom:
    topic: /slam_3d/frontend/odom
    type: nav_msgs/msg/Odometry
    owner: future_gole_lio_frontend
  frontend_path:
    topic: /slam_3d/frontend/path
    type: nav_msgs/msg/Path
    owner: future_gole_lio_frontend
  backend_odom:
    topic: /slam_3d/backend/odom
    type: nav_msgs/msg/Odometry
    owner: future_gole_pose_graph_backend
  backend_path:
    topic: /slam_3d/backend/path
    type: nav_msgs/msg/Path
    owner: future_gole_pose_graph_backend
  pose_graph:
    topic: /slam_3d/backend/pose_graph
    type: visualization_or_custom_message
    owner: future_gole_pose_graph_backend
  active_submap:
    topic: /slam_3d/map/active_submap
    type: sensor_msgs/msg/PointCloud2
    owner: future_gole_submap_manager
  global_map:
    topic: /slam_3d/map/global_cloud
    type: sensor_msgs/msg/PointCloud2
    owner: future_gole_map_store
  health:
    topic: /slam_3d/health
    type: diagnostics_or_custom_summary
    owner: each_slam_module

downstream_bridge_topics:
  nav2_odom:
    topic: /odom
    rule: publish_only_when_2d_navigation_stack_is_intentionally_using_3d_slam_pose
  nav2_tf:
    frames:
      - map_to_odom
      - odom_to_base_link
    rule: exactly_one_localization_or_slam_stack_may_publish_these_transforms

rules:
  - Raw Livox CustomMsg data is the LIO input contract.
  - PointCloud2 debug topics are not allowed to replace raw Livox input for LIO.
  - Do not run lidar_preprocessing or PointXYZ-only conversion before deskew/LIO.
  - Do not concatenate front/rear PointCloud2 as the primary LIO measurement.
  - The frontend must keep source sensor id, extrinsic, timestamp, and covariance per point batch.
  - The backend owns map->odom only in mapping/localization modes where AMCL and the existing localization node are disabled.
