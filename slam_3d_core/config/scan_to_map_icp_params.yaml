# Sensor/calibration settings and common controls; tuning is in src/parameter_profile.cpp.
scan_to_map_icp_node:
  ros__parameters:
    parameter_profile: hesai_triple
    use_sim_time: false
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    publish_tf: false
    primary_cloud_topic: /slam_3d/input/hesai_center/points_timed
    secondary_cloud_topic: /slam_3d/input/hesai_front/points_timed
    tertiary_cloud_topic: /slam_3d/input/hesai_rear/points_timed
    use_secondary_cloud: true
    use_tertiary_cloud: true
    wheel_odom_topic: /motor_driver_node/odom
    imu_topic: /imu/data
    imu_require_expected_frame: false
    imu_expected_frame: ''
    use_wheel_prediction: true
    use_tf_transforms: true
    deskew_enabled: true
    inter_lidar_imu_rotation_scale: 1.0
    deskew_point_time_field: offset_time
    deskew_point_time_scale: 0.0
    deskew_point_time_offset_s: 0.0
    deskew_angular_velocity_scale: 1.0
    deskew_imu_to_base_roll_deg: 0.0
    deskew_imu_to_base_pitch_deg: 0.0
    deskew_imu_to_base_yaw_deg: 0.0
    registration_method: gicp  # icp | gicp | fast_gicp | ndt | voxel_surfel
    max_range_m: 80.0
    scan_voxel_leaf_m: 0.25
    map_voxel_leaf_m: 0.35
    keyframe_archive_directory: ''
    pose_graph_solver: legacy_relaxation
    gravity_accel_scale: 1.0
