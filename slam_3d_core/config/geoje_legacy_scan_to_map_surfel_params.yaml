scan_to_map_icp_node:
  ros__parameters:
    use_sim_time: true
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    publish_tf: false

    primary_cloud_topic: /slam_3d/input/hesai_center/points_timed
    secondary_cloud_topic: /slam_3d/input/hesai_front/points_timed
    tertiary_cloud_topic: /slam_3d/input/hesai_rear/points_timed
    use_secondary_cloud: true
    use_tertiary_cloud: true
    cloud_subscription_reliable: true
    cloud_subscription_depth: 10
    # 5 s timeout at 0.5x replay can retain roughly 50 primary scans at 10 Hz.
    cloud_sync_queue_size: 64
    max_secondary_stamp_delta_s: 0.08
    max_auxiliary_stamp_delta_s: 0.08
    # At 0.5x replay, the observed 1.7 s primary gap spans 3.4 s wall time.
    cloud_sync_wait_timeout_s: 5.0
    cloud_sync_reorder_window_s: 0.02
    cloud_processing_period_s: 0.005

    wheel_odom_topic: /motor_driver_node/odom
    wheel_odom_require_expected_frames: true
    wheel_odom_expected_frame: odom
    wheel_odom_expected_child_frame: base_link
    imu_topic: /imu/data
    use_wheel_prediction: true
    use_constant_velocity_prediction: true
    wheel_odom_buffer_duration_s: 30.0
    wheel_odom_buffer_max_samples: 5000
    # The source bag contains verified 1.05-1.50 s odometry publication gaps.
    # Interpolate only for this legacy replay; production keeps the strict
    # 0.15/0.25 s limits in scan_to_map_icp_params.yaml.
    wheel_odom_max_time_delta_s: 1.6
    wheel_odom_max_interpolation_gap_s: 1.6
    wheel_odom_timestamp_reset_threshold_s: 0.5
    use_tf_transforms: true
    reject_cloud_on_tf_failure: true

    deskew_enabled: true
    inter_lidar_motion_compensation_enabled: true
    inter_lidar_motion_compensation_source: wheel_odom
    inter_lidar_motion_compensation_max_dt_s: 0.08
    inter_lidar_imu_rotation_scale: 1.0
    inter_lidar_gap_recovery_hypothesis_enabled: false
    inter_lidar_gap_recovery_hypothesis_min_gap_s: 0.5
    inter_lidar_gap_recovery_hypothesis_min_score_improvement_ratio: 0.02
    inter_lidar_motion_failure_policy: drop_auxiliary
    deskew_point_time_field: offset_time
    deskew_point_time_scale: 0.0
    deskew_max_scan_duration_s: 0.2
    deskew_max_imu_gap_s: 0.05
    # Offline registration can lag simulated time by several seconds.
    deskew_imu_buffer_duration_s: 30.0
    deskew_min_time_ratio: 0.5
    deskew_time_bin_s: 0.001
    deskew_angular_velocity_scale: 1.0
    # v11 tested quaternion deltas but increased max-iteration exits and runtime.
    # Keep the implementation available while retaining the v10 wheel-yaw prior.
    imu_rotation_prediction_enabled: false
    imu_rotation_prediction_source: orientation
    imu_rotation_prediction_max_dt_s: 2.0
    imu_rotation_prediction_scale: 1.0
    imu_orientation_prediction_max_time_delta_s: 0.05
    reject_cloud_on_deskew_failure: false

    registration_method: voxel_surfel
    robust_registration_enabled: false
    min_scan_points: 200
    scan_voxel_leaf_m: 0.25
    map_voxel_leaf_m: 0.30
    local_map_radius_m: 30.0
    max_local_keyframes: 40
    min_range_m: 0.5
    max_range_m: 80.0
    crop_box_enabled: true
    keyframe_translation_m: 0.5
    keyframe_rotation_deg: 5.0
    map_publish_period_s: 0.5

    # Relaxed only for the clock-damaged Geoje replay. Production values must
    # be re-tuned after PTP and extrinsic commissioning.
    surfel_voxel_size_m: 1.0
    surfel_min_points_per_voxel: 5
    surfel_max_planarity_ratio: 0.30
    surfel_min_tangent_variance: 0.0001
    surfel_max_plane_distance_m: 0.50
    surfel_max_center_distance_m: 1.80
    surfel_min_correspondences: 200
    surfel_min_correspondence_ratio: 0.08
    surfel_huber_delta_m: 0.15
    surfel_max_iterations: 12
    surfel_max_backtracking_steps: 5
    surfel_backtracking_factor: 0.5
    surfel_rotation_convergence_rad: 0.0002
    surfel_translation_convergence_m: 0.0002
    surfel_relative_cost_convergence: 0.00001
    surfel_max_rotation_step_rad: 0.20
    surfel_max_translation_step_m: 0.50
    surfel_rotation_scale_m_per_rad: 1.0
    surfel_relative_eigen_threshold: 0.001
    surfel_min_observable_rank: 3
    surfel_max_quality_rmse_m: 0.40
    surfel_max_quality_p95_m: 0.80

    odom_topic: /slam_3d/frontend/odom
    path_topic: /slam_3d/frontend/path
    local_map_topic: /slam_3d/map/active_submap
    global_map_topic: /slam_3d/map/global_cloud
    health_topic: /slam_3d/health
    imu_watermark_topic: /slam_3d/imu_watermark_ns
