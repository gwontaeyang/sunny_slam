slam_toolbox:
  ros__parameters:
    # use_sim_time: launch 파일에서 override 가능 (bag 재생 시 true로 설정)
    use_sim_time: false

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    mode: "mapping"
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "base_footprint"
    scan_topic: "/scan_laserscan"  # 기본값, launch에서 override 예정
    use_map_saver: true

    # General Parameters
    resolution: 0.03
    map_update_interval: 1.0       # 맵 업데이트 간격 (초)
    max_laser_range: 20.0
    min_laser_range: 0.1  # 실제 LiDAR 최소 범위에 맞춤 (경고 해결)
    minimum_time_interval: 0.2
    minimum_travel_distance: 0.12  # 최소 이동 거리 (m) - 흔들림-only scan matching 억제
    minimum_travel_heading: 0.08   # 최소 회전 각도 (rad) - 흔들림-only scan matching 억제
    transform_publish_period: 0.05
    throttle_scans: 1              # 모든 스캔 처리 (1 = 모든 스캔, 5 = 5개 중 1개)
    tf_buffer_duration: 120.0      # 긴 bag replay timestamp gap에도 TF cache 유지
    transform_timeout: 0.5         # TF 대기 시간 증가
    scan_queue_size: 100            # slam_toolbox MessageFilter 큐 크기 증가
    enable_interactive_mode: false
    debug_logging: false

    # Scan Matching Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.12
    link_scan_maximum_distance: 2.0

    # Loop Closing Parameters
    loop_search_maximum_distance: 10.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 5.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters
    correlation_search_space_dimension: 3.0
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
